  (function () {
    var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    function initTyped() {
      var nodes = document.querySelectorAll(".typed-tagline");
      for (var i = 0; i < nodes.length; i++) {
        (function (el) {
          var phrases = (el.getAttribute("data-phrases") || "").split("|").filter(Boolean);
          var target = el.querySelector(".typed-text");
          if (!target || !phrases.length) return;
          if (reduce) {
            target.textContent = phrases[0];
            return;
          }
          var pi = 0,
            ci = 0,
            deleting = false;
          function tick() {
            var word = phrases[pi];
            if (!deleting) {
              target.textContent = word.slice(0, ++ci);
              if (ci === word.length) {
                deleting = true;
                return setTimeout(tick, 1700);
              }
            } else {
              target.textContent = word.slice(0, --ci);
              if (ci === 0) {
                deleting = false;
                pi = (pi + 1) % phrases.length;
              }
            }
            setTimeout(tick, deleting ? 45 : 95);
          }
          tick();
        })(nodes[i]);
      }
    }

    function initReveal() {
      var els = document.querySelectorAll(".post-header, .profile, .clearfix, article > h2, .social, .cv .card");
      if (!els.length) return;
      if (reduce || !("IntersectionObserver" in window)) {
        for (var i = 0; i < els.length; i++) {
          els[i].classList.add("reveal", "is-visible");
        }
        return;
      }
      document.body.classList.add("js-reveal");
      for (var j = 0; j < els.length; j++) {
        els[j].classList.add("reveal");
      }
      var obs = new IntersectionObserver(
        function (entries) {
          entries.forEach(function (e) {
            if (e.isIntersecting) {
              e.target.classList.add("is-visible");
              obs.unobserve(e.target);
            }
          });
        },
        { threshold: 0.08, rootMargin: "0px 0px -40px 0px" },
      );
      for (var k = 0; k < els.length; k++) {
        obs.observe(els[k]);
      }
    }

    function init() {
      initTyped();
      initReveal();
    }
    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", init);
    } else {
      init();
    }
  })();
</script> </body> </html>

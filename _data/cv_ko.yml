- title: 수강 과목
  type: nested_list
  contents:
    - title: 수학 (Mathematics)
      items:
        - 미적분학, 선형대수학, 미분방정식, 위상수학
        - 학습이론, 수리통계학, 고급통계학, 수치해석
    - title: 컴퓨터과학 (Computer Science)
      items:
        - 자료구조, 알고리즘 입문, 컴퓨터 구조, 시스템 프로그래밍
        - 프로그래밍 언어, 함수형 프로그래밍, 형식언어 및 오토마타, 데이터베이스 입문
        - 기계학습 입문, 강화학습 입문, 컴퓨터 보안, 네트워크

